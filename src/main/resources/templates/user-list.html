<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="content" lang="zh">
<body>
<div>
    <!-- 页面标题 -->
    <div class="d-flex align-items-center mb-4">
        <div class="me-3">
            <i class="bi bi-people-fill text-primary" style="font-size: 2rem; color: #ff6b81 !important;"></i>
        </div>
        <div>
            <h2 class="mb-1">用户管理</h2>
            <p class="text-muted mb-0">查看和管理所有注册用户</p>
        </div>
    </div>

    <!-- 用户列表 -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="border-0" style="width: 80px;">
                            <i class="bi bi-hash me-1"></i>ID
                        </th>
                        <th class="border-0" style="width: 150px;">
                            <i class="bi bi-person me-1"></i>用户名
                        </th>
                        <th class="border-0">
                            <i class="bi bi-envelope me-1"></i>邮箱
                        </th>
                        <th class="border-0" style="width: 150px;">
                            <i class="bi bi-person-badge me-1"></i>昵称
                        </th>
                        <th class="border-0" style="width: 120px;">
                            <i class="bi bi-tag me-1"></i>类型
                        </th>
                        <th class="border-0" style="width: 180px;">
                            <i class="bi bi-clock-history me-1"></i>创建时间
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}" class="align-middle">
                        <td class="fw-semibold text-muted" th:text="${user.id}"></td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle bg-light d-flex align-items-center justify-content-center me-2"
                                     style="width: 32px; height: 32px;">
                                    <i class="bi bi-person-fill text-muted"></i>
                                </div>
                                <span class="fw-medium" th:text="${user.username}"></span>
                            </div>
                        </td>
                        <td>
                            <div class="d-flex align-items-center">
                                <i class="bi bi-envelope-fill text-muted me-2"></i>
                                <span th:text="${user.email}"></span>
                            </div>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark" th:text="${user.nickname}"></span>
                        </td>
                        <td>
              <span th:if="${user.userType == 'ADMIN'}"
                    class="badge bg-danger">
                <i class="bi bi-shield-fill me-1"></i>管理员
              </span>
                            <span th:if="${user.userType == 'USER'}"
                                  class="badge bg-primary">
                <i class="bi bi-person-fill me-1"></i>普通用户
              </span>
                        </td>
                        <td class="text-muted small" th:text="${#temporals.format(user.createdAt, 'MM-dd HH:mm')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="6" class="text-center py-5">
                            <div class="text-muted">
                                <i class="bi bi-people" style="font-size: 3rem;"></i>
                                <p class="mt-3 mb-0">暂无用户数据</p>
                                <small>当前还没有用户注册</small>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 分页导航 -->
    <div class="d-flex justify-content-between align-items-center mt-4" th:if="${totalPages > 1}">
        <div class="text-muted small">
            <i class="bi bi-info-circle me-1"></i>
            第 <span th:text="${currentPage}" class="fw-semibold text-primary"></span> 页，
            共 <span th:text="${totalPages}" class="fw-semibold text-primary"></span> 页，
            总计 <span th:text="${totalItems}" class="fw-semibold text-primary"></span> 位用户
        </div>

        <nav aria-label="用户分页">
            <ul class="pagination mb-0">
                <!-- 上一页 -->
                <li class="page-item" th:class="${currentPage == 1} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1})}"
                       th:tabindex="${currentPage == 1} ? '-1' : null"
                       th:aria-disabled="${currentPage == 1} ? 'true' : 'false'">
                        <i class="bi bi-chevron-left"></i>
                        上一页
                    </a>
                </li>

                <!-- 页码 -->
                <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                    class="page-item" th:class="${i == currentPage} ? 'active' : ''">
                    <a class="page-link" th:href="@{/admin/users(page=${i})}"
                       th:text="${i}">1</a>
                </li>

                <!-- 下一页 -->
                <li class="page-item" th:class="${currentPage == totalPages} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1})}"
                       th:tabindex="${currentPage == totalPages} ? '-1' : null"
                       th:aria-disabled="${currentPage == totalPages} ? 'true' : 'false'">
                        下一页
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- 统计信息 -->
    <div class="row mt-4" th:if="${!#lists.isEmpty(users)}">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center text-muted small">
        <span>
          <i class="bi bi-info-circle me-1"></i>
          当前页显示 <span th:text="${#lists.size(users)}" class="fw-semibold text-primary"></span> 位用户
        </span>
                <span>
          <i class="bi bi-heart-fill me-1" style="color: #ff6b81;"></i>
          心动选项管理后台
        </span>
            </div>
        </div>
    </div>

    <!-- 用户统计卡片 -->
    <div class="row mt-4" th:if="${!#lists.isEmpty(users)}">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-people-fill text-primary" style="font-size: 2rem; color: #ff6b81 !important;"></i>
                    <h5 class="mt-2 mb-1" th:text="${#lists.size(users)}">0</h5>
                    <p class="text-muted mb-0">总用户数</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-person-fill text-info" style="font-size: 2rem;"></i>
                    <h5 class="mt-2 mb-1" th:text="${#lists.size(users) - 1}">0</h5>
                    <p class="text-muted mb-0">普通用户</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-shield-fill text-warning" style="font-size: 2rem;"></i>
                    <h5 class="mt-2 mb-1">1</h5>
                    <p class="text-muted mb-0">管理员</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .table-hover tbody tr:hover {
        background-color: rgba(255, 107, 129, 0.05);
    }

    .badge {
        font-size: 0.75rem;
        padding: 0.5em 0.8em;
    }

    .card {
        border-radius: 12px;
    }

    .card-body {
        transition: all 0.3s ease;
    }

    .card:hover .card-body {
        transform: translateY(-2px);
    }

    .pagination .page-link {
        color: #ff6b81;
        border: 1px solid #dee2e6;
        padding: 0.5rem 0.75rem;
    }

    .pagination .page-link:hover {
        color: #fff;
        background-color: #ff6b81;
        border-color: #ff6b81;
    }

    .pagination .page-item.active .page-link {
        background-color: #ff6b81;
        border-color: #ff6b81;
    }

    .pagination .page-item.disabled .page-link {
        color: #6c757d;
        background-color: #fff;
        border-color: #dee2e6;
    }
</style>
</body>
</html>
