<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>后台登录 - 心动选项</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 420px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #ff6b81 0%, #ff8e9e 100%);
            color: white;
            text-align: center;
            padding: 2rem 1rem 1rem;
            margin: -1rem -1rem 2rem;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
            margin: 0;
        }

        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #ff6b81;
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 129, 0.25);
        }

        .form-label {
            color: #495057;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .btn-login {
            background: linear-gradient(135deg, #ff6b81 0%, #ff8e9e 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #ff5a70 0%, #ff7d8d 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 129, 0.3);
        }

        .alert-danger {
            border-radius: 10px;
            border: none;
            background-color: #fff5f5;
            color: #e53e3e;
            font-size: 0.9rem;
        }

        .heart-icon {
            color: #ff6b81;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card login-card">
        <div class="login-header">
            <div class="heart-icon mb-2">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
            <h4 class="login-title">心动选项</h4>
            <p class="login-subtitle">管理员登录</p>
        </div>
        <div class="card-body px-4">
            <form th:action="@{/admin/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="bi bi-person-fill me-1"></i>用户名
                    </label>
                    <input id="username" name="username" class="form-control" type="text"
                           th:value="${username}" placeholder="请输入用户名">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">
                        <i class="bi bi-lock-fill me-1"></i>密码
                    </label>
                    <input id="password" name="password" class="form-control" type="password" placeholder="请输入密码">
                </div>
                <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
                <button type="submit" class="btn btn-primary btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>登录
                </button>
            </form>
        </div>
    </div>
</div>
<link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
</body>
</html>
